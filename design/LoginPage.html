<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Design · LoginPage</title>
<link rel="stylesheet" href="./tokens.css" />
<style>
  .page { min-height: 100vh; display: flex; flex-direction: column; }

  /* 顶部品牌栏：半透明材质 */
  .topbar {
    position: sticky; top: 0; z-index: 20;
    display: flex; align-items: center; justify-content: space-between;
    height: 60px; padding: 0 24px;
    border-bottom: 1px solid var(--hairline);
  }
  .brand { display: flex; align-items: center; gap: 10px; font-size: 17px; font-weight: 700; letter-spacing: -0.01em; }
  .brand svg { width: 28px; height: 28px; color: var(--primary); }

  .stage { flex: 1; display: flex; align-items: center; justify-content: center; padding: 48px 24px; }

  /* 登录卡片 */
  .login-card { width: 400px; padding: 36px 32px 0; border-radius: var(--radius-xl); overflow: hidden; }
  .login-card .head { margin-bottom: 28px; }
  .login-card .head .display { margin-bottom: 8px; }
  .form { display: flex; flex-direction: column; gap: 18px; }
  .pw-wrap { position: relative; }
  .pw-wrap .input { padding-right: 44px; }
  .pw-eye {
    position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
    width: 32px; height: 32px; border: none; background: transparent; border-radius: var(--radius-sm);
    display: inline-flex; align-items: center; justify-content: center;
    color: var(--label-tertiary); cursor: pointer;
    transition: color var(--duration-micro) var(--ease-out), background-color var(--duration-micro) var(--ease-out);
  }
  .pw-eye:hover { color: var(--primary); background: var(--primary-tint); }

  .alert {
    display: flex; align-items: center; gap: 8px;
    padding: 10px 14px; border-radius: var(--radius-sm); font-size: 13px; font-weight: 500;
  }
  .alert-error { background: var(--danger-tint); color: var(--danger); }
  .alert-success { background: var(--primary-tint); color: var(--primary-pressed); }

  .submit { margin-top: 6px; }

  .card-foot {
    margin: 28px -32px 0; padding: 18px 32px; text-align: center;
    background: var(--surface-secondary); font-size: 14px; color: var(--label-secondary);
  }
  .card-foot a { color: var(--primary); font-weight: 600; text-decoration: none; }
  .card-foot a:hover { text-decoration: underline; }

  /* 状态展示列 */
  .states { width: 400px; display: flex; flex-direction: column; gap: 16px; }
  .state-block .caption { margin-bottom: 8px; color: var(--label-tertiary); }
  .state-card { background: var(--surface); border-radius: var(--radius-md); box-shadow: var(--shadow-card); padding: 16px; display: flex; flex-direction: column; gap: 12px; }
</style>
</head>
<body>
<div class="design-badge material-thick"><span class="dot"></span>Design · LoginPage — 浅色 Apple 规范</div>

<div class="page">
  <!-- 顶部品牌栏：半透明材质，内容滚动时从底下穿过 -->
  <header class="topbar material">
    <div class="brand">
      <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M13.8 17.4c2.9.7 6.4 1.1 10.2 1.1s7.3-.4 10.2-1.1c2.7-.7 5.8-2.2 7.2-3.3L24.8 40.6a1.2 1.2 0 0 1-1.6 0L6.6 14.2c1.4 1.1 4.4 2.6 7.2 3.2Z" fill="currentColor"/>
        <path fill-rule="evenodd" clip-rule="evenodd" d="M40 12.2c0 .1 0 .1-1.6 1.4a27 27 0 0 1-6.2 2c-3 .7-6.4 1.1-10.2 1.1s-7.3-.4-10.2-1.1c-2.3-.5-4.9-1.8-6.2-2.7-.1-.2-.2-.5-.3-.7 0-.1 0-.2 2-1.4a35 35 0 0 1 27 0c.8.5 1.5 1 2 1.4.9.5 1 1.2 1 1.6ZM4.9 15.2l16.5 26.5a3 3 0 0 0 5.2 0l16.5-26.5.1-.1-1.8-1c1.8 1 1.8 1 1.8 1l.1-.2v-.1l.1-.2c.2-.4.5-1 .7-1.8.2-.4.7-1.2.7-2.3 0-1.7-1-3-2.1-4a19 19 0 0 0-4.5-2.3A35 35 0 0 0 24 4a35 35 0 0 0-13.4 2 19 19 0 0 0-4.5 2.3c-1.1 1-2.1 2.3-2.1 4 0 .8.3 1.6.5 2.1.1.2.2.5.3.6l.2.3v.2ZM36 19 24 38.2 12 19c.5.2 1 .3 1.4.4A37 37 0 0 0 24 20.5c3.9 0 7.5-.4 10.6-1.1.5-.1 1-.3 1.4-.4Z" fill="currentColor"/>
      </svg>
      云盘
    </div>
    <button class="btn btn-ghost btn-sm">注册</button>
  </header>

  <main class="stage gap-32" style="flex-wrap: wrap;">
    <!-- 主形态：默认 -->
    <div class="login-card card">
      <div class="head">
        <h1 class="display">欢迎回来</h1>
        <p class="body-text t-secondary">登录以继续使用云盘。</p>
      </div>

      <form class="form">
        <div class="field">
          <label class="field-label" for="username">用户名</label>
          <input class="input" id="username" type="text" placeholder="请输入用户名" />
        </div>
        <div class="field">
          <label class="field-label" for="password">密码</label>
          <div class="pw-wrap">
            <input class="input" id="password" type="password" placeholder="请输入密码（至少 6 位）" />
            <button type="button" class="pw-eye" aria-label="显示密码">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
                <path d="M3 12c1.8-4.2 5.1-6.5 9-6.5s7.2 2.3 9 6.5c-1.8 4.2-5.1 6.5-9 6.5S4.8 16.2 3 12Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
                <path d="M12 15.2a3.2 3.2 0 1 0 0-6.4 3.2 3.2 0 0 0 0 6.4Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
              </svg>
            </button>
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-lg submit">登录</button>
      </form>

      <div class="card-foot">
        还没有账号？<a href="./RegisterPage.html">立即注册</a>
      </div>
    </div>

    <!-- 状态：错误 / 成功 / 提交中 -->
    <div class="states">
      <div class="state-block">
        <p class="caption">状态 · 校验错误（inline，非提交后才报）</p>
        <div class="state-card">
          <div class="alert alert-error">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.8"/><path d="M12 8v5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="12" cy="16.2" r="1.1" fill="currentColor"/></svg>
            密码至少 6 位
          </div>
          <div class="field">
            <label class="field-label">密码</label>
            <input class="input is-error" type="password" value="12345" />
            <p class="field-error">密码至少 6 位</p>
          </div>
        </div>
      </div>

      <div class="state-block">
        <p class="caption">状态 · 提交中 / 成功</p>
        <div class="state-card">
          <button class="btn btn-primary btn-lg is-disabled" disabled>登录中…</button>
          <div class="alert alert-success">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.8"/><path d="m8.5 12.2 2.4 2.4 4.6-5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
            登录成功，正在进入…
          </div>
        </div>
      </div>
    </div>
  </main>
</div>
</body>
</html>
